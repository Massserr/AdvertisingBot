services:
  postgres:
    image: postgres:16-alpine
    container_name: adbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adbot
      POSTGRES_USER: adbot
      POSTGRES_PASSWORD: adbot
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: adbot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
